<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyInvoice Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3ff;
}

.header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:450px;
margin:30px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
margin-bottom:20px;
}

input,select{
width:100%;
padding:14px;
margin:10px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.invoice{
margin-top:25px;
border:2px solid #2563eb;
padding:20px;
border-radius:10px;
background:#f8fbff;
}

.invoice h3{
color:#2563eb;
}

.total{
font-size:24px;
font-weight:bold;
color:green;
margin-top:15px;
}

</style>

</head>

<body>

<div class="header">
🚀 EasyInvoice Pro
</div>


<div class="container">


<div id="homePage">

<h2>Choose Invoice Type</h2>

<button onclick="showBusiness()">
🏢 Business Invoice
</button>

<button onclick="showPersonal()" style="background:#16a34a;">
👤 Personal Invoice
</button>

</div>



<div id="businessPage" style="display:none;">

<h2>Create Business Invoice</h2>

<button onclick="goHome()" style="background:#6b7280;">
🏠 Home
</button>


<input id="company" placeholder="Company Name">


<select id="business">

<option>Grocery Shop</option>
<option>Restaurant</option>
<option>Cafe</option>
<option>Clothing Store</option>
<option>Electronics Shop</option>
<option>Freelancer</option>

</select>


<input id="customer" placeholder="Customer Name">

<input id="product" placeholder="Product Name">


<select id="currency">

<option value="$">$ USD</option>
<option value="Rs">Rs PKR</option>
<option value="€">€ Euro</option>

</select>


<input id="price" type="number" placeholder="Price">

<input id="qty" type="number" placeholder="Quantity">


<button onclick="generateInvoice()">
Generate Invoice
</button>


<button onclick="window.print()" style="background:#16a34a;">
🖨️ Print Invoice
</button>


<div id="result"></div>


<button onclick="showHistory()" style="background:#f59e0b;">
📄 Invoice History
</button>


<button onclick="clearHistory()" style="background:#dc2626;">
🗑️ Clear History
</button>


<div id="history"></div>


</div>

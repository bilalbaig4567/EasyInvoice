<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyInvoice Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3ff;
}

.header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:450px;
margin:30px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#result{
margin-top:25px;
}

.invoice{
border:2px solid #2563eb;
padding:20px;
border-radius:10px;
background:#f8fbff;
}

.invoice h3{
color:#2563eb;
margin-bottom:15px;
}

.total{
font-size:24px;
font-weight:bold;
color:green;
margin-top:15px;
}

</style>

</head>

<body>

<div class="header">
🚀 EasyInvoice Pro
</div>

<div class="container">

<h2>Create Invoice</h2>

<input id="customer" placeholder="Customer Name">

<input id="product" placeholder="Product Name">

<input id="price" type="number" placeholder="Price">

<input id="qty" type="number" placeholder="Quantity">

  <button onclick="generateInvoice()">Generate Invoice</button>
  <button onclick="window.print()" style="background:#16a34a;color:white;padding:15px;width:100%;margin-top:10px;border:none;border-radius:10px;font-size:18px;color:white;">
🖨️ Print Invoice
</button>

<div id="result"></div>

</div>

<script>

function generateInvoice(){

let customer=document.getElementById("customer").value;
let product=document.getElementById("product").value;
let price=Number(document.getElementById("price").value);
let qty=Number(document.getElementById("qty").value);

if(customer=="" || product=="" || price<=0 || qty<=0){
alert("Please fill all fields.");
return;
}

let total=price*qty;
let invoiceNo=Math.floor(Math.random()*900000)+100000;
let now = new Date();
let today = now.toLocaleDateString();
let time = now.toLocaleTimeString();

document.getElementById("result").innerHTML=`
<div class="invoice">

<h3>EasyInvoice Pro</h3>

<p><b>Invoice No:</b> ${invoiceNo}</p>

<p><b>Date:</b> ${today}</p>
<p><b>Time:</b> ${time}</p>
<hr>

<p><b>Customer:</b> ${customer}</p>

<p><b>Product:</b> ${product}</p>

<p><b>Price:</b> $${price}</p>

<p><b>Quantity:</b> ${qty}</p>

<hr>

<div class="total">
Total: $${total}
</div>

</div>
`;

}

</script>

</body>
</html>

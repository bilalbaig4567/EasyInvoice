<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyInvoice Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3ff;
}

.header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:450px;
margin:30px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
margin-bottom:20px;
}

input,select{
width:100%;
padding:14px;
margin:10px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.invoice{
margin-top:25px;
border:2px solid #2563eb;
padding:20px;
border-radius:10px;
background:#f8fbff;
}

.invoice h3{
color:#2563eb;
}

.total{
font-size:24px;
font-weight:bold;
color:green;
margin-top:15px;
}

@media print {

body{
background:white;
}

.header,
button,
#history{
display:none;
}

.container{
box-shadow:none;
margin:0;
max-width:100%;
}

.invoice{
border:2px solid black;
}

}

</style>

</head>

<body>


<div class="header">
🚀 EasyInvoice Pro
</div>


<div class="container">


<!-- HOME PAGE -->

<div id="homePage">

<h2>Choose Invoice Type</h2>

<button onclick="showBusiness()">
🏢 Business Invoice
</button>

<button onclick="showPersonal()" style="background:#16a34a;">
👤 Personal Invoice
</button>

</div>



<!-- BUSINESS PAGE -->

<div id="businessPage" style="display:none;">

<h2>Create Business Invoice</h2>


<button onclick="goHome()" style="background:#6b7280;">
🏠 Home
</button>


<input id="company" placeholder="Company Name">
<label><b>Company Logo (Optional)</b></label>

<input
type="file"
id="logo"
accept="image/*">

<label><b>Business Type</b></label>

<select id="business">

<option>Grocery Shop</option>
<option>Cafe</option>
<option>Restaurant</option>
<option>Clothing Store</option>
<option>Electronics Shop</option>
<option>Medical Store</option>
<option>Pharmacy</option>
<option>Salon</option>
<option>Clinic</option>
<option>Freelancer</option>
<option>Wholesale</option>

</select>



<label><b>Country</b></label>

<select id="country">

<option value="Pakistan">🇵🇰 Pakistan</option>
<option value="USA">🇺🇸 USA</option>
<option value="UK">🇬🇧 United Kingdom</option>
<option value="UAE">🇦🇪 UAE</option>
<option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
<option value="Malaysia">🇲🇾 Malaysia</option>
<option value="Canada">🇨🇦 Canada</option>
<option value="Australia">🇦🇺 Australia</option>

</select>



<label><b>Currency</b></label>

<select id="currency">

<option value="Rs">🇵🇰 PKR (Rs)</option>
<option value="$">🇺🇸 USD ($)</option>
<option value="£">🇬🇧 GBP (£)</option>
<option value="د.إ">🇦🇪 AED (د.إ)</option>
<option value="﷼">🇸🇦 SAR (﷼)</option>
<option value="RM">🇲🇾 MYR (RM)</option>
<option value="C$">🇨🇦 CAD (C$)</option>
<option value="A$">🇦🇺 AUD (A$)</option>

</select>


<input id="customer" placeholder="Customer Name">

<input id="product" placeholder="Product Name">

<input id="price" type="number" placeholder="Price">

<input id="qty" type="number" placeholder="Quantity">


<button onclick="generateInvoice()">
Generate Invoice
</button>


<button onclick="window.print()" style="background:#16a34a;">
🖨️ Print Invoice
</button>


<div id="result"></div>


<button onclick="showHistory()" style="background:#f59e0b;">
📄 Invoice History
</button>
📄 Invoice History
</button>


<button onclick="clearHistory()" style="background:#dc2626;">
🗑️ Clear History
</button>
🗑️ Clear History
</button>


<div id="history"></div>


</div>




<!-- PERSONAL PAGE -->


<div id="personalPage" style="display:none;">


<h2>👤 Personal Invoice</h2>


<button onclick="goHome()" style="background:#6b7280;">
🏠 Home
</button>


<input id="pname" placeholder="Your Name">

<input id="pcustomer" placeholder="Customer Name">

<input id="pproduct" placeholder="Product Name">

<input id="pprice" type="number" placeholder="Price">

<input id="pqty" type="number" placeholder="Quantity">


<button>
Generate Personal Invoice
</button>


<div id="personalResult"></div>


</div>


</div>

<script>

function showBusiness(){

document.getElementById("homePage").style.display="none";
document.getElementById("businessPage").style.display="block";
document.getElementById("personalPage").style.display="none";

}


function showPersonal(){

document.getElementById("homePage").style.display="none";
document.getElementById("businessPage").style.display="none";
document.getElementById("personalPage").style.display="block";

}


function goHome(){

document.getElementById("homePage").style.display="block";
document.getElementById("businessPage").style.display="none";
document.getElementById("personalPage").style.display="none";

}



function generateInvoice(){

let company=document.getElementById("company").value;
let business=document.getElementById("business").value;
let country=document.getElementById("country").value;
let currency=document.getElementById("currency").value;

let customer=document.getElementById("customer").value;
let product=document.getElementById("product").value;

let price=Number(document.getElementById("price").value);
let qty=Number(document.getElementById("qty").value);


if(company=="" || customer=="" || product=="" || price<=0 || qty<=0){

alert("Please fill all fields");
return;

}


let total=price*qty;

let invoiceNo=Math.floor(Math.random()*900000)+100000;

let date=new Date().toLocaleDateString();


let invoice=`

<div class="invoice">

<h3>🚀 EasyInvoice Pro</h3>

<p><b>Company:</b> ${company}</p>

<p><b>Business:</b> ${business}</p>

<p><b>Country:</b> ${country}</p>

<hr>

<p><b>Invoice No:</b> ${invoiceNo}</p>

<p><b>Date:</b> ${date}</p>

<hr>

<p><b>Customer:</b> ${customer}</p>

<p><b>Product:</b> ${product}</p>

<p><b>Price:</b> ${currency}${price}</p>

<p><b>Quantity:</b> ${qty}</p>

<hr>

<div class="total">
Total: ${currency}${total}
</div>

</div>

`;


document.getElementById("result").innerHTML=invoice;


// Save History

let oldHistory=localStorage.getItem("invoiceHistory") || "";

localStorage.setItem(
"invoiceHistory",
invoice + "<hr>" + oldHistory
);


}



function showHistory(){

let history=localStorage.getItem("invoiceHistory");


if(history==null){

document.getElementById("history").innerHTML=
"<p>No invoices found.</p>";

}else{

document.getElementById("history").innerHTML=history;

}

}



function clearHistory(){

localStorage.removeItem("invoiceHistory");

document.getElementById("history").innerHTML=
"<p>History cleared.</p>";

}



function generatePersonalInvoice(){

let name=document.getElementById("pname").value;
let customer=document.getElementById("pcustomer").value;
let product=document.getElementById("pproduct").value;

let price=Number(document.getElementById("pprice").value);
let qty=Number(document.getElementById("pqty").value);


if(name=="" || customer=="" || product=="" || price<=0 || qty<=0){

alert("Please fill all fields");
return;

}


let total=price*qty;


document.getElementById("personalResult").innerHTML=`

<div class="invoice">

<h3>👤 Personal Invoice</h3>

<p><b>Name:</b> ${name}</p>

<p><b>Customer:</b> ${customer}</p>

<p><b>Product:</b> ${product}</p>

<p><b>Total:</b> ${total}</p>


</div>

`;

}


</script>
</body>
</html>

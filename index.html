<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyInvoice</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef3ff;
}

.header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:400px;
margin:30px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#result{
margin-top:20px;
background:#f7f7f7;
padding:15px;
border-radius:10px;
}
</style>

</head>
<body>

<div class="header">
EasyInvoice
</div>

<div class="container">

<h2>Create Invoice</h2>

<input id="customer" placeholder="Customer Name">

<input id="product" placeholder="Product Name">

<input id="price" type="number" placeholder="Price">

<input id="qty" type="number" placeholder="Quantity">

<button onclick="generateInvoice()">Generate Invoice</button>

<div id="result"></div>

</div>

<script>
function generateInvoice(){

let c=document.getElementById("customer").value;
let p=document.getElementById("product").value;
let pr=Number(document.getElementById("price").value);
let q=Number(document.getElementById("qty").value);

let total=pr*q;

document.getElementById("result").innerHTML=`
<h3>Invoice</h3>
<p><b>Customer:</b> ${c}</p>
<p><b>Product:</b> ${p}</p>
<p><b>Price:</b> $${pr}</p>
<p><b>Quantity:</b> ${q}</p>
<hr>
<h2>Tlet invoiceNo = Math.floor(Math.random() * 100000);

document.getElementById("result").innerHTML = `
<div style="background:white;padding:20px;border-radius:12px;border:2px solid #2563eb;">

<h2 style="color:#2563eb;">EasyInvoice</h2>

<p><b>Invoice #:</b> ${invoiceNo}</p>
<p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

<hr>

<p><b>Customer:</b> ${c}</p>
<p><b>Product:</b> ${p}</p>
<p><b>Price:</b> $${pr}</p>
<p><b>Quantity:</b> ${q}</p>

<hr>

<h2>Total: $${total}</h2>

</div>
`;
`;

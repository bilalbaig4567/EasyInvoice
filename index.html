<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyInvoice Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3ff;
}

.header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:450px;
margin:30px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
margin-bottom:20px;
}

input,select{
width:100%;
padding:14px;
margin:10px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.invoice{
margin-top:25px;
border:2px solid #2563eb;
padding:20px;
border-radius:10px;
background:#f8fbff;
.invoice{
border:2px solid black;
}

#businessPage h2,
#history,
#historyBtn,
#clearHistoryBtn{
display:none !important;
}

}
}

.invoice h3{
color:#2563eb;
}

.total{
font-size:24px;
font-weight:bold;
color:green;
margin-top:15px;
}

@media print {

body{
#businessPage input,
#businessPage select,
#businessPage button,
#businessPage label,
#history{
display:none !important;
}

#result{
display:block !important;
}

.invoice{
page-break-inside:avoid;
break-inside:avoid;
} 
background:white;
}

.header,
button,
#history{
display:none;
}

.container{
box-shadow:none;
margin:0;
max-width:100%;
}

.invoice{
border:2px solid black;
}
#businessPage h2,
#businessPage > button:first-child{
display:none !important;
}
}
#businessPage textarea{
display:none !important;
}
#recentCustomers,
h3{
display:none !important;
}
  #recentProducts,
#recentProducts + h3{
display:none !important;
}
</style>

</head>

<body>


<div class="header">
🚀 EasyInvoice Pro
</div>


<div class="container">


<!-- HOME PAGE -->

<div id="homePage">

<h2>Choose Invoice Type</h2>

<button onclick="showBusiness()">
🏢 Business Invoice
</button>

<button onclick="showPersonal()" style="background:#16a34a;">
👤 Personal Invoice
</button>

</div>



<!-- BUSINESS PAGE -->

<div id="businessPage" style="display:none;">

<h2>Create Business Invoice</h2>


<button onclick="goHome()" style="background:#6b7280;">
🏠 Home
</button>


<input id="company" placeholder="Company Name">
<input id="address" placeholder="Company Address">
<input id="phone" placeholder="Company Phone Number">
<input id="email" type="email" placeholder="Company Email">
<input id="website" placeholder="Company Website"> 
<input id="taxid" placeholder="NTN / Tax ID (Optional)">
<textarea id="notes" placeholder="Customer Notes (Optional)" style="width:100%;padding:14px;margin:10px 0;font-size:16px;border:1px solid #ccc;border-radius:8px;height:90px;"></textarea> 
<label><b>Company Logo (Optional)</b></label>

<input
type="file"
id="logo"
accept="image/*">

<label><b>Business Type</b></label>

<select id="business">

<option>Grocery Shop</option>
<option>Cafe</option>
<option>Restaurant</option>
<option>Clothing Store</option>
<option>Electronics Shop</option>
<option>Medical Store</option>
<option>Pharmacy</option>
<option>Salon</option>
<option>Clinic</option>
<option>Freelancer</option>
<option>Wholesale</option>

</select>



<label><b>Country</b></label>

<select id="country">

<option value="Pakistan">🇵🇰 Pakistan</option>
<option value="USA">🇺🇸 USA</option>
<option value="UK">🇬🇧 United Kingdom</option>
<option value="UAE">🇦🇪 UAE</option>
<option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
<option value="Malaysia">🇲🇾 Malaysia</option>
<option value="Canada">🇨🇦 Canada</option>
<option value="Australia">🇦🇺 Australia</option>

</select>



<label><b>Currency</b></label>

<select id="currency">

<option value="Rs">🇵🇰 PKR (Rs)</option>
<option value="$">🇺🇸 USD ($)</option>
<option value="£">🇬🇧 GBP (£)</option>
<option value="د.إ">🇦🇪 AED (د.إ)</option>
<option value="﷼">🇸🇦 SAR (﷼)</option>
<option value="RM">🇲🇾 MYR (RM)</option>
<option value="C$">🇨🇦 CAD (C$)</option>
<option value="A$">🇦🇺 AUD (A$)</option>

</select>


<input id="customer" list="customerList" placeholder="Customer Name">

<datalist id="customerList"></datalist>

<input id="product" placeholder="Product Name">

<input id="price" type="number" placeholder="Price">

<input id="qty" type="number" placeholder="Quantity">
<input id="tax" type="number" placeholder="Tax (%)" value="0">
<input id="discount" type="number" placeholder="Discount (%)" value="0">
<select id="status">
<option value="🟢 Paid">🟢 Paid</option>
<option value="🟡 Pending">🟡 Pending</option>
<option value="🔴 Unpaid">🔴 Unpaid</option>
</select>
<input id="dueDate" type="date"> 
<button onclick="generateInvoice()">
Generate Invoice
</button>
<button onclick="resetCompanyProfile()" style="background:#dc2626;">
🗑️ Reset Company Profile
</button>  


<button onclick="window.print()" style="background:#16a34a;">
🖨️ Print Invoice
</button>


<div id="result"></div>
<h3>🕒 Recent Customers</h3>

<div id="recentCustomers"></div>
<h3>📦 Recent Products</h3>

<div id="recentProducts"></div>
<button id="historyBtn" onclick="showHistory()" style="background:#f59e0b;">
📄 Invoice History
</button>


<button id="clearHistoryBtn" onclick="clearHistory()" style="background:#dc2626;">
🗑️ Clear History
</button>


<div id="history"></div>


</div>




<!-- PERSONAL PAGE -->


<div id="personalPage" style="display:none;">


<h2>👤 Personal Invoice</h2>


<button onclick="goHome()" style="background:#6b7280;">
🏠 Home
</button>


<input id="pname" placeholder="Your Name">

<input id="pcustomer" placeholder="Customer Name">

<input id="pproduct" placeholder="Product Name">

<input id="pprice" type="number" placeholder="Price">

<input id="pqty" type="number" placeholder="Quantity">


<button>
Generate Personal Invoice
</button>


<div id="personalResult"></div>


</div>


</div>

<script>

function showBusiness(){
document.getElementById("company").value = localStorage.getItem("companyName") || "";
document.getElementById("address").value = localStorage.getItem("companyAddress") || "";
document.getElementById("phone").value = localStorage.getItem("companyPhone") || "";
document.getElementById("email").value = localStorage.getItem("companyEmail") || "";
document.getElementById("website").value = localStorage.getItem("companyWebsite") || "";
document.getElementById("taxid").value = localStorage.getItem("companyTaxId") || "";
document.getElementById("homePage").style.display="none";
document.getElementById("businessPage").style.display="block";
document.getElementById("personalPage").style.display="none";
loadCustomers();
}
showRecentCustomers();
showRecentProducts();
function showPersonal(){

document.getElementById("homePage").style.display="none";
document.getElementById("businessPage").style.display="none";
document.getElementById("personalPage").style.display="block";

}


function goHome(){

document.getElementById("homePage").style.display="block";
document.getElementById("businessPage").style.display="none";
document.getElementById("personalPage").style.display="none";

}



function generateInvoice(){

let company=document.getElementById("company").value;
let address=document.getElementById("address").value; 
let phone=document.getElementById("phone").value;
let email=document.getElementById("email").value; 
let website=document.getElementById("website").vvaluelet;
let taxid=document.getElementById("taxid").value;
let notes=document.getElementById("notes").value;
let logo = document.getElementById("logo").files[0];
let business=document.getElementById("business").value;
let country=document.getElementById("country").value;
let currency=document.getElementById("currency").value;

let customer=document.getElementById("customer").value;
let customers = JSON.parse(localStorage.getItem("customers")) || [];

if(customer && !customers.includes(customer)){
customers.push(customer);
localStorage.setItem("customers", JSON.stringify(customers));
}
let product=document.getElementById("product").value;
let products = JSON.parse(localStorage.getItem("products")) || [];

if(product && !products.includes(product)){
products.push(product);
localStorage.setItem("products", JSON.stringify(products));
}
let price=Number(document.getElementById("price").value);
let qty=Number(document.getElementById("qty").value);
let tax=Number(document.getElementById("tax").value);
let discount=Number(document.getElementById("discount").value);
let status=document.getElementById("status").value;
let dueDate=document.getElementById("dueDate").value; 
if(company=="" || customer=="" || product=="" || price<=0 || qty<=0){

alert("Please fill all fields");
return;

}


let total=price*qty;
let taxAmount = (total * tax) / 100;
let discountAmount = (total * discount) / 100; 
let grandTotal = total + taxAmount - discountAmount;
let invoiceCounter = Number(localStorage.getItem("invoiceCounter")) || 1;

let invoiceNo = "INV-2026-" + String(invoiceCounter).padStart(6,"0");

localStorage.setItem("invoiceCounter", invoiceCounter + 1);

let now = new Date();

let date = now.toLocaleDateString("en-GB", {
day: "2-digit",
month: "short",
year: "numeric"
});

let time = now.toLocaleTimeString("en-US", {
hour: "2-digit",
minute: "2-digit"
});


let invoice=`

<div class="invoice">

<h3>🚀 EasyInvoice Pro</h3>
<div id="logoArea"></div>
<p><b>Company:</b> ${company}</p>
${address ? `<p><b>Address:</b> ${address}</p>` : ""}
${phone ? `<p><b>Phone:</b> ${phone}</p>` : ""}
${email ? `<p><b>Email:</b> ${email}</p>` : ""}
${website ? `<p><b>Website:</b> ${website}</p>` : ""}
${taxid ? `<p><b>NTN / Tax ID:</b> ${taxid}</p>` : ""}
<p><b>Business:</b> ${business}</p>

<p><b>Country:</b> ${country}</p>

<hr>
<p style="font-size:18px;font-weight:bold;">${status}</p>
<p><b>Invoice No:</b> ${invoiceNo}</p>

<p><b>Date:</b> ${date}</p>
<p><b>Due Date:</b> ${dueDate}</p>
<p><b>Time:</b> ${time}</p>
<hr>

<p><b>Customer:</b> ${customer}</p>

<p><b>Product:</b> ${product}</p>

<p><b>Price:</b> ${currency}${price}</p>

<p><b>Quantity:</b> ${qty}</p>

<hr>

<p><b>Subtotal:</b> ${currency}${total}</p>

<p><b>Tax (${tax}%):</b> ${currency}${taxAmount}</p>
<p><b>Discount (${discount}%):</b> -${currency}${discountAmount}</p>
<hr>

<div class="total">
Grand Total: ${currency}${grandTotal}
</div>
<hr>

${notes ? `<p><b>Notes:</b> ${notes}</p>` : ""}

<br>

<p style="text-align:center;color:#16a34a;font-weight:bold;">
🙏 Thank you for your business!
</p>
</div>

`;


document.getElementById("result").innerHTML=invoice;
localStorage.setItem("companyName", company);
localStorage.setItem("companyAddress", address);
localStorage.setItem("companyPhone", phone);
localStorage.setItem("companyEmail", email);
localStorage.setItem("companyWebsite", website);
localStorage.setItem("companyTaxId", taxid); 
if (logo) {

const url = URL.createObjectURL(logo);

document.getElementById("logoArea").innerHTML =
`<img src="${url}" style="width:80px;height:80px;border-radius:10px;margin-bottom:10px;">`;

}

// Save History

let oldHistory=localStorage.getItem("invoiceHistory") || "";

localStorage.setItem(
"invoiceHistory",
invoice + "<hr>" + oldHistory
);


}



function showHistory(){

let history=localStorage.getItem("invoiceHistory");


if(history==null){

document.getElementById("history").innerHTML=
"<p>No invoices found.</p>";

}else{

document.getElementById("history").innerHTML=history;

}

}



function clearHistory(){

localStorage.removeItem("invoiceHistory");

document.getElementById("history").innerHTML=
"<p>History cleared.</p>";

}



function generatePersonalInvoice(){

let name=document.getElementById("pname").value;
let customer=document.getElementById("pcustomer").value;
let product=document.getElementById("pproduct").value;

let price=Number(document.getElementById("pprice").value);
let qty=Number(document.getElementById("pqty").value);


if(name=="" || customer=="" || product=="" || price<=0 || qty<=0){

alert("Please fill all fields");
return;

}


let total=price*qty;


document.getElementById("personalResult").innerHTML=`

<div class="invoice">

<h3>👤 Personal Invoice</h3>

<p><b>Name:</b> ${name}</p>

<p><b>Customer:</b> ${customer}</p>

<p><b>Product:</b> ${product}</p>

<p><b>Total:</b> ${total}</p>


</div>

`;

}

function resetCompanyProfile(){

localStorage.removeItem("companyName");
localStorage.removeItem("companyAddress");
localStorage.removeItem("companyPhone");
localStorage.removeItem("companyEmail");
localStorage.removeItem("companyWebsite");
localStorage.removeItem("companyTaxId");

document.getElementById("company").value="";
document.getElementById("address").value="";
document.getElementById("phone").value="";
document.getElementById("email").value="";
document.getElementById("website").value="";
document.getElementById("taxid").value="";

alert("Company Profile Reset Successfully!");

} 
function loadCustomers(){

let customers = JSON.parse(localStorage.getItem("customers")) || [];

let list = document.getElementById("customerList");

list.innerHTML = "";

customers.forEach(function(c){

list.innerHTML += `<option value="${c}">`;

});
function showRecentCustomers(){

let customers = JSON.parse(localStorage.getItem("customers")) || [];

let html = "";

customers.slice().reverse().forEach(function(c){

html += `<button onclick="document.getElementById('customer').value='${c}'" style="width:auto;margin:5px;padding:8px 12px;">${c}</button>`;

});

document.getElementById("recentCustomers").innerHTML = html;

}
}
 function showRecentProducts(){

let products = JSON.parse(localStorage.getItem("products")) || [];

let html = "";

products.slice().reverse().forEach(function(p){

html += `<button onclick="document.getElementById('product').value='${p}'" style="width:auto;margin:5px;padding:8px 12px;">${p}</button>`;

});

document.getElementById("recentProducts").innerHTML = html;

} 
</script>
</body>
</html>
